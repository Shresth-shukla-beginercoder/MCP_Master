
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCP Master AI</title>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #212121;
      --panel: #171717;
      --text: #ececec;
      --muted: #a0a0a0;
      --border: #3b3b3b;
      --accent: #10a37f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100dvh;
      display: flex;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    button, textarea { font: inherit; }
    button { cursor: pointer; }

    .sidebar {
      width: 260px;
      flex-shrink: 0;
      background: var(--panel);
      padding: 18px 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .brand {
      font-size: 19px;
      font-weight: 700;
      padding: 8px;
    }

    .new-chat {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 12px;
      text-align: left;
    }

    .new-chat:hover, .send:hover { opacity: .85; }

    .sidebar-note {
      margin-top: auto;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      padding: 8px;
    }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 17px 24px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px 18px;
    }

    .welcome {
      max-width: 680px;
      margin: 12vh auto 0;
      text-align: center;
    }

    .welcome h1 { font-size: 30px; }

    .welcome p {
      color: var(--muted);
      line-height: 1.6;
    }

    .message {
      max-width: 760px;
      margin: 0 auto 24px;
      display: flex;
      gap: 14px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .avatar {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #343434;
      font-size: 13px;
    }

    .assistant .avatar {
      background: var(--accent);
      color: white;
    }

    .content {
      padding-top: 4px;
      min-width: 0;
      flex: 1;
    }

    .content p { margin: 0 0 12px; }
    .content p:last-child { margin-bottom: 0; }

    .content h1, .content h2, .content h3 {
      margin: 20px 0 10px;
      line-height: 1.35;
    }

    .content h1 { font-size: 1.5rem; }
    .content h2 { font-size: 1.3rem; }
    .content h3 { font-size: 1.1rem; }

    .content ul, .content ol {
      padding-left: 24px;
      margin: 8px 0 14px;
    }

    .content li { margin: 4px 0; }

    .content code {
      background: #343434;
      padding: 2px 5px;
      border-radius: 4px;
      font-family: Consolas, monospace;
      font-size: .9em;
    }

    .content pre {
      background: #111;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      overflow-x: auto;
      margin: 12px 0;
    }

    .content pre code {
      padding: 0;
      background: transparent;
      white-space: pre;
    }

    .content table {
      display: block;
      width: 100%;
      overflow-x: auto;
      border-collapse: collapse;
      margin: 12px 0;
    }

    .content th, .content td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
    }

    .content th { background: #343434; }
    .content a { color: #7dd3fc; }

    .content blockquote {
      margin: 12px 0;
      padding: 4px 14px;
      border-left: 3px solid var(--accent);
      color: #c5c5c5;
    }

    .content hr {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 16px 0;
    }

    .composer-wrap { padding: 12px 18px 18px; }

    .composer {
      max-width: 760px;
      margin: auto;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      border: 1px solid #505050;
      border-radius: 18px;
      padding: 10px 12px;
      background: #303030;
    }

    textarea {
      flex: 1;
      min-width: 0;
      max-height: 180px;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      padding: 8px 2px;
      line-height: 1.5;
    }

    .send {
      border: none;
      border-radius: 10px;
      padding: 10px 13px;
      color: white;
      background: var(--accent);
    }

    .send:disabled { opacity: .5; cursor: not-allowed; }

    .hint {
      max-width: 760px;
      margin: 10px auto 0;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
    }

    @media (max-width: 600px) {
      .sidebar { width: 64px; padding: 12px 6px; }
      .brand { font-size: 0; text-align: center; }
      .brand::after { content: "M"; font-size: 20px; }
      .new-chat { font-size: 0; text-align: center; padding: 12px 4px; }
      .new-chat::after { content: "+"; font-size: 20px; }
      .sidebar-note { display: none; }
      header { padding: 16px; }
      .welcome h1 { font-size: 24px; }
    }
  </style>
</head>

<body>
  <aside class="sidebar">
    <div class="brand">MCP Master AI</div>
    <button class="new-chat" id="newChat">＋ New chat</button>
    <div class="sidebar-note">
      Powered by Gemini<br>
      Connected to your MCP tools
    </div>
  </aside>

  <main class="main">
    <header>Gemini MCP Assistant</header>

    <section id="messages" aria-live="polite">
      <div class="welcome" id="welcome">
        <h1>What can I help with?</h1>
        <p>Ask a question, read a text file, or analyze a CSV using your MCP tools.</p>
      </div>
    </section>

    <div class="composer-wrap">
      <form class="composer" id="chatForm">
        <textarea id="messageInput" rows="1"
          placeholder="Message MCP Master AI..." required></textarea>
        <button class="send" id="sendButton" type="submit">↑</button>
      </form>
      <p class="hint">AI responses can be inaccurate. Verify important results.</p>
    </div>
  </main>

  <script>
    const messages = document.getElementById("messages");
    const welcome = document.getElementById("welcome");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const newChat = document.getElementById("newChat");

    // Stores conversation messages for the current chat.
    let chatHistory = [];

    function renderMarkdown(element, text) {
      if (
        typeof marked === "undefined" ||
        typeof DOMPurify === "undefined"
      ) {
        element.textContent = text;
        return;
      }

      element.innerHTML = DOMPurify.sanitize(
        marked.parse(text, { gfm: true, breaks: true })
      );
    }

    function addMessage(role, text) {
      const row = document.createElement("div");
      row.className = `message ${role}`;

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "You" : "AI";

      const content = document.createElement("div");
      content.className = "content";

      if (role === "assistant" && text !== "Thinking...") {
        renderMarkdown(content, text);
      } else {
        content.textContent = text;
      }

      row.append(avatar, content);
      messages.appendChild(row);
      messages.scrollTop = messages.scrollHeight;

      return row;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const message = input.value.trim();
      if (!message || sendButton.disabled) return;

      welcome.hidden = true;
      addMessage("user", message);

      input.value = "";
      input.style.height = "auto";
      sendButton.disabled = true;
      sendButton.textContent = "…";

      const thinking = addMessage("assistant", "Thinking...");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message,
            history: chatHistory
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || "The request failed.");
        }

        const reply = String(data.reply ?? "No response received.");

        renderMarkdown(
          thinking.querySelector(".content"),
          reply
        );

        // Save both sides only after a successful response.
        chatHistory.push(
          { role: "user", content: message },
          { role: "assistant", content: reply }
        );
      } catch (error) {
        thinking.querySelector(".content").textContent =
          `Error: ${error.message}. Check that the backend is running.`;
      } finally {
        sendButton.disabled = false;
        sendButton.textContent = "↑";
        input.focus();
        messages.scrollTop = messages.scrollHeight;
      }
    });

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 180) + "px";
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    newChat.addEventListener("click", () => {
      chatHistory = [];
      messages.replaceChildren();
      messages.appendChild(welcome);
      welcome.hidden = false;
      input.value = "";
      input.style.height = "auto";
      input.focus();
    });
  </script>
</body>
</html>
