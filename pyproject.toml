
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "mcp-master-toolkit-2026"
version = "0.1.0"
description = "MCP server, client, and LangChain integration"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.1.0",
    "langchain-google-genai>=4.4.2",
    "langchain[mcp]>=1.4.6",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
]

[project.scripts]
mcp-master-http = "servers.http_server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["servers*"]

[tool.uv]
link-mode = "copy"

[dependency-groups]
dev = [
    "build>=1.6.1",
    "twine>=7.0.0",
]
